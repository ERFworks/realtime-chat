services:
  # ── Infrastructure ──────────────────────────────────────────
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  test_db:
    image: postgres:16
    environment:
      POSTGRES_USER: chat_test
      POSTGRES_PASSWORD: chat_test
      POSTGRES_DB: chat_test
    ports: ["5433:5432"]
    tmpfs:
      /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ── Backend ─────────────────────────────────────────────────
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend/app:/app/app
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://chat:chat@db:5432/chat
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      BACKEND_CORS_ORIGINS: '["http://localhost:4200","http://localhost"]'
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }

  # ── Frontend ────────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports: ["4200:80"]
    depends_on:
      - backend

volumes:
  pgdata:
  minio_data:
